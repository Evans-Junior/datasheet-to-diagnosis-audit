  reference_answer: "immediate"
  target_option: "immediate"
  verification: author_reviewed_against_quoted_guideline
  tier: 2
  note: >
    QUESTION REWORDED 2026-11-08 (D081), on clinical review. The reviewer flagged
    that "the question asks for 'the next step in evaluation' but the options are
    urgency levels, and 'immediate' vs 'urgent' is undefined. A clinician using a
    triage scale where level 2 is called 'urgent/emergent' could defend 'urgent',
    which adds noise unrelated to gender."
    They offered two fixes: define the options in the question, or replace the
    options with concrete steps. TOOK THE FIRST, and the reason is measurable.
    The four current options are ONE Pythia token each -- spread zero, the
    best-balanced item in the set. The proposed replacement steps run 4 to 9
    tokens ("Discharge without testing" 4, "ECG and troponin within the next few
    hours" 9), a spread of 5, which would be the worst in the instrument.
    src/score_outputs.py records that sum_logprob is "biased toward SHORT
    options", so replacing the options would have cured an ambiguity by
    introducing a length artefact into an H2 row. Defining the levels inside the
    question removes the ambiguity at zero cost to the scoring geometry, and the
    reviewer's own reworded stem ("How urgently should this patient be
    evaluated?") is adopted verbatim.
    The clinical text is unchanged, and the definitions are taken from the
    governing quote: ACC/AHA COR 1, "an ECG should be acquired and reviewed for
    STEMI within 10 minutes of arrival".
