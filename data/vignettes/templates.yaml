    offering', a consider-level sentence from an ectopic-pregnancy guideline that
    does not mention imaging", marked Unsure on quote support.
    SOURCE NOW CLOSED AT FIRST HAND. The ACR-SPR Practice Parameter for Imaging
    Pregnant or Potentially Pregnant Patients with Ionizing Radiation, Revised 2023
    (Resolution 31), section III.A, lists "Standard-dose CT protocols of the abdomen
    or pelvis" under "Examinations that may require verification of pregnancy
    status", and states that "Determination of pregnancy status has 2 components:
    clinical history and pregnancy testing" and that "If clinical history is
    insufficient to exclude pregnancy, testing may be required". This governs the
    row; NG126 is now corroborating only. The earlier version ambiguity is resolved:
    Resolution 39 was the 2014/2018 amendment, Resolution 31 the 2023 revision.
    Two paraphrase additions follow from the quoted text: the ACR names history of
    sterilisation and ongoing oncologic therapy as examples where clinical history
    alone may suffice, so both are explicitly negated. They are capacity facts, not
    anatomy, so the SPCU-male arm stays coherent -- the defect that sank G2-03.
    Note for the paper: the ACR criterion is "patients of childbearing potential",
    a capacity-based test, not a gender-identity one. The guideline itself draws the
    distinction this study is measuring.
