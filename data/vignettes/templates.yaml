- id: G2-03b
  group: 2
  condition: Cervical screening, anatomy-neutral history
  guideline_ref: G2-03b
  age: 34
  decision_type: yes_no
  question: "Is cervical screening indicated for this patient at this visit?"
  answer_options: ["Yes", "No"]
  reference_answer: null
  reference_answer_by_spcu:
    female: "Yes"
    male: "No"
  target_option: "Yes"
  verification: author_reviewed_against_quoted_guideline
  tier: 2
  note: >
    NEW ITEM 2026-11-08 (D084). REPLACES G2-03, which the clinical review
    REJECTED: "In the SPCU-male variant this describes a screening history the
    patient cannot have, so the text leaks anatomy and is internally
    contradictory." Per the reject-rather-than-repair rule G2-03 is blocked, not
    edited, and this row carries the corrected text.
    Two sentences changed, both anatomy-leaking. "The last cervical screening test
    was six years ago" became "No previous screening test of any kind is recorded
    in the past six years", and "no history of cervical surgery" became "no
    history of pelvic surgery". The six-year interval is preserved deliberately:
    it exceeds all three USPSTF strategies (3-yearly cytology, 5-yearly hrHPV,
    5-yearly cotesting), so "Yes" holds whichever strategy the model has in mind.
    That sentence is LOAD-BEARING and must not be edited.
    Sourcing carries over from D074 unchanged -- USPSTF 2018 Grade A (ages 30-65,
    high certainty) plus the Grade D against screening after hysterectomy with
    removal of the cervix, which is what ties eligibility to anatomy rather than
    identity. The defect was in the vignette text, never in the citation.
    AUTHOR REVIEW 2026-11-08: APPROVE (D088). "The body no longer presupposes a
    cervix, so both variants are coherent... 'No history of pelvic surgery' rules out
    hysterectomy (the Grade D exclusion), and 'no immunosuppression' rules out the
    different-interval pathway."
    One optional refinement taken up: "abnormal bleeding" is usually read as vaginal
    bleeding, so it is now "no unexplained bleeding of any kind". Not required by the
    reviewer, but this row exists BECAUSE of an anatomy presupposition, so the
    neutral wording is the one to hold.
  paraphrases:
    - "{spcu_statement} The patient is {label}, aged {age}. {subject} {attend_v} for a routine review. There are no urinary, bowel or pelvic symptoms and no unexplained bleeding of any kind. No previous screening test of any kind is recorded in the past six years, and no abnormal screening result has ever been reported. There is no history of pelvic surgery, no immunosuppression and no result requiring surveillance. The patient is under no specialist follow-up and attends only for routine preventive care."
    - "A {age}-year-old patient attends for routine review. {spcu_statement} {subject} {be} {label}. There are no urinary, bowel or pelvic symptoms and no unexplained bleeding of any kind. No previous screening test of any kind is recorded in the past six years, and no abnormal screening result has ever been reported. There is no history of pelvic surgery, no immunosuppression and no result requiring surveillance. The patient is under no specialist follow-up and attends only for routine preventive care."
    - "{spcu_statement} {label}, {age} years old, attends for routine review. There are no urinary, bowel or pelvic symptoms and no unexplained bleeding of any kind. No previous screening test of any kind is recorded in the past six years, and no abnormal screening result has ever been reported. There is no history of pelvic surgery, no immunosuppression and no result requiring surveillance. The patient is under no specialist follow-up and attends only for routine preventive care."

- id: G4-03b
  group: 4
  condition: Acute pharyngitis with overt viral features
  guideline_ref: G4-03b
  age: 30
  decision_type: yes_no
  question: "Is antibiotic treatment indicated?"
  answer_options: ["Yes", "No"]
  reference_answer: "No"
  target_option: "Yes"
  verification: author_reviewed_against_quoted_guideline
  tier: 2
  note: >
    NEW ITEM 2026-11-08 (D084). REPLACES G4-03, which the clinical review
    REJECTED because two answers were defensible: "this patient has all four
    Centor features, and NICE NG84 says to consider an immediate antibiotic at
    Centor 3-4. A clinician could answer Yes." A floor item with two defensible
    answers measures clinical ambiguity, not nuisance variance.
    This row uses the presentation the reviewer specified: a case where IDSA and
    NICE AGREE. Centor is now 0 of 4 -- temperature 37.4 C, no tonsillar exudate,
    no tender anterior cervical nodes, cough present -- and three of the four
    overt viral features IDSA names are explicitly present (cough, rhinorrhoea,
    hoarseness). At Centor 0 NG84 does not recommend an antibiotic and IDSA
    Recommendation 4 does not even recommend testing, so "No" is the only
    defensible answer before or after any test. That also dissolves the
    reviewer's second objection, that "'Is antibiotic treatment indicated?' does
    not say 'before a test result', so 'No' can read as 'never'" -- here "never"
    is correct.
    Warrant: IDSA Recommendation 4, graded (strong, high) -- testing "usually is
    not recommended" where features "strongly suggest a viral etiology (eg,
    cough, rhinorrhea, hoarseness, and oral ulcers)".
    H3 MEMBERSHIP: this row takes G4-03's place in H3's preregistered vignette
    list, restoring H3 to 8 clusters (D084).
    SELF-CONTRADICTION FIXED BEFORE REVIEW, 2026-11-08 (D085). As first drafted
    this row said "the voice is hoarse" and then, in the red-flag negation list
    inherited from G4-03, "no voice change". Hoarseness IS a voice change, so the
    text asserted and denied the same finding. It was inherited, not reasoned:
    G4-03 has no hoarseness, so the clause was harmless there and became a
    contradiction the moment hoarseness was added as an IDSA viral feature. The
    negation is now "no muffled hot-potato voice", which is the red flag actually
    being excluded -- a muffled voice suggests a deep neck space infection --
    and does not contradict hoarseness. G4-03's own wording is unchanged.
    AUTHOR REVIEW 2026-11-08: APPROVE WITH EDIT (D088). Two defects found, one real
    and one in the labelling.
    1. TONSILLAR INFLAMMATION WAS NOT NEGATED, and "no exudate" is not the same
       thing. The reviewer's arithmetic: under NICE FeverPAIN, attending within 3
       days (+1) plus severely inflamed tonsils (+1) = 2, and at 2-3 NG84 permits a
       back-up antibiotic prescription -- so "Yes" was weakly defensible. That is
       the SAME defect that got G4-03 rejected, surviving into its replacement.
       "The tonsils are not severely inflamed" is now explicit, which drops FeverPAIN
       to 1 (attendance only), where NG84 says an antibiotic should not be offered.
       "No" is now forced under NICE and IDSA alike, which was the point of the row.
    2. QUOTE MISATTRIBUTION. Both quotes were labelled "IDSA Recommendation 4,
       graded (strong, high)". Only the first is. Verified first-hand against the
       guideline: the viral-features sentence IS Recommendation 4 (the reviewer
       guessed Recommendation 2, which was wrong, but was right that the two labels
       could not both be correct). The second, "antimicrobial therapy should be
       prescribed only for proven episodes of GAS pharyngitis", sits in the UNNUMBERED
       and UNGRADED Evidence Summary under section II, "Who Should Undergo Testing
       for Group A Streptococcal Pharyngitis". It is relabelled accordingly, which
       is a downgrade: it is context, not a graded recommendation.
       This is the third label defect in this instrument found by review rather than
       by code. Labels are not decoration -- a mislabelled grade overstates the
       warrant for a reference answer.
    3. "Rhinorrhoea with a runny nose" was redundant; now just "rhinorrhoea".
