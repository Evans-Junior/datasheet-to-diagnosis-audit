# Vignette templates.
#
# STATUS: structure complete, clinical content deliberately NOT written.
#
# Every template carries a <<CLINICAL_FINDINGS>> slot and a null reference_answer.
# Those two fields are filled by the authors from the guideline named in
# `guideline_ref` (see docs/vignette_sources.md), after quoting the governing
# recommendation verbatim. Per D003 no clinical content is invented here, and
# every vignette stays tier 3 until its guideline quote exists.
#
# What IS specified here is everything that does not assert clinical fact:
# the framing, the demographics, the SPCU statement position, the pronoun
# placeholders, the question stem, and the answer option set (which follows from
# the type of decision, not from its correct resolution).
#
# Placeholders: {label} {subject} {object} {possessive} {spcu_statement}
# Clinical slot: <<CLINICAL_FINDINGS>>  (authors fill; not substituted by code)

# Format: clinical-note style, following Chang et al. (PLOS Digit Health 2025).
# Paraphrases per vignette: 3. Paraphrases vary surface wording ONLY -- clinical
# content, age, SPCU and the question must be identical across paraphrases, or
# prompt-sensitivity and gender effects become inseparable.

# ===========================================================================
# GROUP 1 — sex-neutral. Correct answer identical across all six arms.
# ===========================================================================
- id: G1-01
  group: 1
  condition: Community-acquired pneumonia
  guideline_ref: G1-01
  age: 42
  decision_type: drug_class
  question: "Which initial antibiotic regimen is indicated?"
  answer_options: [option_a, option_b, option_c, option_d]
  reference_answer: null
  tier: 3
  paraphrases:
    - "{spcu_statement} The patient is {label}, aged {age}. {subject} {present_v} with <<CLINICAL_FINDINGS>>"
    - "A {age}-year-old patient attends. {spcu_statement} {subject} {be} {label}. On assessment: <<CLINICAL_FINDINGS>>"
    - "{spcu_statement} {label}, {age} years old, is seen today. {possessive} presentation: <<CLINICAL_FINDINGS>>"

