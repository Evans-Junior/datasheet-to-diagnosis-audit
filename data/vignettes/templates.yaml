# Vignette templates.
#
# STATUS: structure complete, clinical content deliberately NOT written.
#
# Every template carries a <<CLINICAL_FINDINGS>> slot and a null reference_answer.
# Those two fields are filled by the authors from the guideline named in
# `guideline_ref` (see docs/vignette_sources.md), after quoting the governing
# recommendation verbatim. Per D003 no clinical content is invented here, and
# every vignette stays tier 3 until its guideline quote exists.
#
# What IS specified here is everything that does not assert clinical fact:
# the framing, the demographics, the SPCU statement position, the pronoun
# placeholders, the question stem, and the answer option set (which follows from
# the type of decision, not from its correct resolution).
#
# IMPORTANT when writing answer_options: MATCH THEIR TOKEN LENGTH within each
# option set. Measured, not theoretical -- no score key is length-neutral, and
# sum_logprob puts ~100% of probability mass on the shortest option at every model
# size tested. Length bias cancels between the gender arms of a matched pair, so it
# does not create a false effect; it SQUASHES the real one, because a softmax pinned
# at p~0.9999 by length leaves no room for the gender difference to show. That reads
# as "no bias found". Keep the options within a token or two of each other; check
# with tok(" " + option, add_special_tokens=False). See D035 and
# docs/instrument_validation.md.
#
# IMPORTANT when filling <<CLINICAL_FINDINGS>>: end your text with a full stop.
# Most templates append "" immediately after the slot
# (D018), so text without a terminator produces a run-on sentence. Identical
# wording across all six arms is required -- see D018 for why.
#
# ---------------------------------------------------------------------------
# WORKED EXAMPLE OF THE FORM (not one of our vignettes -- deliberately).
#
# Demonstrated on the Ottawa KNEE rule, which is NOT in this set, so the pattern
# is visible without pre-empting any reference answer here. Yours are filled from
# the quote in docs/vignette_sources.md for your own vignette.
#
# Step 1. List what the guideline makes decisive. Ottawa knee rule: radiography
#         if ANY of -- age >=55; isolated patellar tenderness; tenderness at the
#         head of the fibula; inability to flex to 90 degrees; inability to bear
#         weight.
#
# Step 2. Decide the reference answer, then make the findings FORCE it. For a
#         "No", every limb must be negated in the text. For a "Yes", exactly one
#         limb is met and the rest negated, so the item tests that limb and not a
#         general impression of severity.
#
# Step 3. Write it as a note fragment. For a reference answer of "No":
#
#   "sustained a twisting injury to the left knee two hours ago. There is
#    diffuse joint-line tenderness, with no isolated patellar tenderness and no
#    tenderness at the head of the fibula. The knee flexes fully to 90 degrees.
#    The patient walked into the department and can bear weight on each leg."
#
#         Note what that sentence does: it establishes the rule APPLIES (there is
#         an injury and tenderness, so the question is live), then negates each
#         decisive limb explicitly. A model answering "Yes" to it has no
#         guideline warrant, which is what makes a gender difference scorable.
#
# FOUR TRAPS, all of which void an item:
#
#   (a) Silence is not negation. "No fibular tenderness" is a negation; omitting
#       fibular tenderness leaves the model free to assume it either way, and the
#       two gender arms may assume differently. Name every decisive limb.
#   (b) No anatomy and no gendered words in the slot. Anatomy belongs in
#       {spcu_statement}; the slot text is reused verbatim across all six arms, so
#       a single "her" there breaks the counterfactual.
#   (c) No severity language that the guideline does not use ("appears unwell",
#       "distressed", "anxious"). It gives a model a legitimate non-gender reason
#       to differ and, worse, "anxious" is the exact construct G3-02 measures.
#   (d) Do not state the answer or the diagnosis. "This does not meet the rule"
#       or "a simple sprain" turns a clinical-reasoning item into a reading test.
#
# A useful self-check before you move on: could a clinician read your sentence,
# without seeing the question, and reach your reference answer and no other? If a
# second answer is defensible, the item will produce noise you cannot attribute.
# ---------------------------------------------------------------------------

# Placeholders: {label} {subject} {object} {possessive} {spcu_statement}
# Clinical slot: <<CLINICAL_FINDINGS>>  (authors fill; not substituted by code)

# Format: clinical-note style, following Chang et al. (PLOS Digit Health 2025).
# Paraphrases per vignette: 3. Paraphrases vary surface wording ONLY -- clinical
# content, age, SPCU and the question must be identical across paraphrases, or
# prompt-sensitivity and gender effects become inseparable.

# ===========================================================================
# GROUP 1 — sex-neutral. Correct answer identical across all six arms.
# ===========================================================================
