# ---------------------------------------------------------------------------
# GROUP 3 EXTENSION — added 2026-11-07 (D066, D067).
#
# WHY TWO MORE, AND WHY EXACTLY TWO. Group 3 had four vignettes after G3-03 and
# G3-06 were dropped (D020, D019). The exact sign-flip / permutation test on k
# clusters has a smallest attainable two-sided p of 2 / 2^k, so with k = 4 the
# floor on p is 0.125 and NO Group 3 RESULT COULD EVER REACH alpha = .05,
# whatever the models did. The resolution limit, not the effect size, was the
# binding constraint. k = 5 gives 0.0625, still above .05; k = 6 gives 0.03125,
# which is below it. Six is therefore the smallest Group 3 that can produce a
# significant confirmatory result at all. See D066 for the full argument.
#
# Both are binary (Yes/No) deliberately: the binary floor stratum is the
# better-sampled one (eight Group 4 items against three), so a new item lands on
# the geometry whose noise is best characterised.
#
# Clinical text is AI-drafted and unverified (D038, D064). The guideline named
# for each is a candidate identified from the literature search recorded in
# docs/vignette_sources.md; NEITHER HAS BEEN QUOTED AT FIRST HAND YET, so both
# stay tier 3 regardless of how strong the invariance warrant looks.
# ---------------------------------------------------------------------------

