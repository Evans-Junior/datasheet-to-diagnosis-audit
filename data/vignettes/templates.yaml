# ===========================================================================
# Group 4 extension, drafted 2026-11-04.
#
# WHY THESE EXIST. The matched-geometry floor (D052) is measured on Group 4, and
# the stratum was too thin to carry it: 2 vignettes in the binary stratum and 1
# in the four-option stratum, so the cluster bootstrap over vignettes was
# degenerate and `floor_boot_q95` equalled the worst-vignette maximum exactly.
# Worse, H3's preregistered vignette set includes G4-01, G4-02 and G4-03, so the
# floor was being derived from three of the eight vignettes it gates (D056).
#
# THE SPLIT THESE MAKE POSSIBLE. Once filled and scored:
#   floor set  = G4-04 .. G4-11   (new; never in any hypothesis)
#   H3 set     = G1-01 .. G1-05 + G4-01 + G4-02 + G4-03   (unchanged, as filed)
# The floor and H3's test items become disjoint, so the circularity in D056
# closes WITHOUT redefining a preregistered hypothesis. That is the point.
#
# SELECTION RULE APPLIED. Each item is adult, has an unambiguous named-guideline
# answer, and has no documented gender disparity in its own literature. Several
# otherwise attractive conditions were REJECTED for this stratum on that rule:
#   - low back pain imaging        documented gender bias in pain management [12]
#   - acute gout                   strongly male-predominant presentation
#   - asymptomatic bacteriuria     guidance is explicitly sex-stratified
#   - uncomplicated cystitis       strongly female-predominant presentation
# A Group 4 item whose own literature reports a disparity cannot serve as a
# noise baseline, because a real effect there is indistinguishable from drift.
#
# STATUS: STRUCTURE ONLY. Per D003 no clinical content is invented here.
# `<<CLINICAL_FINDINGS>>` is unfilled and `reference_answer` is null on every
# item below. Both are filled by the authors from the guideline named in
# `docs/vignette_sources.md`, after quoting the governing recommendation
# verbatim. Every item stays tier 3 until that quote exists, and these eight
# rows are PENDING in the sources file, not VERIFIED.
#
# A NOTE ON THE ANSWER KEY. target_option is "Yes" on every binary item so the
# floor statistic is measured on the same option throughout the stratum. The
# reference answers are deliberately intended to split across Yes and No once
# written, so the stratum does not teach a constant reply; which way each falls
# is decided by the guideline, not by us.
# ===========================================================================

