# Model registry. Every result logs the entry it came from, including revision
# and precision, so no table can be traced to the wrong configuration.
#
# Execution is strictly sequential, smallest first (see docs/decisions.md D007).

seed: 20261009

runtime:
  device: mps                 # Apple M4 Pro, 48 GB unified memory, no CUDA
  # float32, NOT bfloat16 (D015). Measured bf16 body noise is ~0.24 nats, which
  # exceeded the 0.14-nat gap between competing options in a test prompt and
  # flipped their ranking. Gender gaps of interest may be that small, so bf16
  # noise could swamp the signal. fp32 doubles memory and roughly doubles time;
  # both are affordable here because scoring is one forward pass per option.
  dtype: float32
  # Peak RAM is set by the largest single model, not the sum: one resident at a
  # time. Hard ceiling below is a guard, not a target.
  max_weights_gb: 30
  purge_after_scoring: false  # set true for the checkpoint sweep

prompt:
  tokens_budget: 256          # representative vignette + question length

# ---------------------------------------------------------------------------
# AUDITED MODELS — open training data. Carry RQ1-RQ4.
# ---------------------------------------------------------------------------
audit:
  pythia_ladder:              # RQ3: gender gap vs model scale
    # ALL SEVEN ARE KEPT (decided 2026-11-07). D059 originally proposed dropping
    # pythia-410m and pythia-1b to hold the set at ten when DCLM was added. That
    # is reversed: all seven stay. The DCLM arms were then withdrawn entirely
    # (D070), so the set is TEN -- 7 Pythia + 2 OLMo-2 + 1 Qwen contrast -- and
    # not the twelve an earlier version of this comment described.
    # Reasons for keeping all seven, in order:
    #   1. 70m and 160m carry the evidence for D042 -- the documented point at
    #      which the instrument stops recovering a planted answer. Deleting them
    #      deletes the support for reading every Pythia null as
    #      instrument-limited rather than as fairness.
    #   2. All seven fail the §6 gate (0.40x, -0.12x, -0.05x, -0.75x, -0.30x,
    #      -0.71x, -0.52x), so "weakest" never discriminated between them.
    #   3. The Pile is now the ONLY corpus not nested inside another (D065), so
    #      the Pythia family carries the whole independent-corpus arm alone.
    #      Thinning it is exactly the wrong move.
    corpus_index: v4_piletrain_llama
    revision: main
    sizes:
      - {id: EleutherAI/pythia-70m,   weights_gb: 0.14}
      - {id: EleutherAI/pythia-160m,  weights_gb: 0.32}
      - {id: EleutherAI/pythia-410m,  weights_gb: 0.82}
      - {id: EleutherAI/pythia-1b,    weights_gb: 2.02}
      - {id: EleutherAI/pythia-1.4b,  weights_gb: 2.84}
      - {id: EleutherAI/pythia-2.8b,  weights_gb: 5.60}
      - {id: EleutherAI/pythia-6.9b,  weights_gb: 13.80}
      # 12b fits for forward-only scoring but leaves little headroom.
      # Run last, single pass, no checkpoints. Optional: the ladder still has
      # 7 points without it.
      # 12b cannot run in fp32 on 48 GB (would need ~48 GB of weights alone),
      # so it runs in float16 — 10 mantissa bits rather than bf16's 7, and the
      # logit range fits comfortably. Report it with a sensitivity check:
      # rescore pythia-6.9b in fp16 and compare against its fp32 result to
      # bound the error this introduces.
      - {id: EleutherAI/pythia-12b,   weights_gb: 23.80, optional: true, dtype: float16}

  pythia_checkpoints:         # RQ3: gender gap across training time
    # One model only. 143 checkpoints x all sizes would need ~414 GB; this needs
    # ~2.9 GB peak because each is deleted after scoring.
    model: EleutherAI/pythia-1.4b
    purge_after_scoring: true
    revisions: [step1000, step2000, step4000, step8000, step16000,
                step32000, step64000, step96000, step143000]

  olmo2:                      # RQ2 + base-vs-instruct (D004)
    # Stage-1 mix only is indexed; dolmino-mix-1124 is not. See D008.
    corpus_index: v4_olmo-mix-1124_llama
    models:
      - {id: allenai/OLMo-2-1124-7B,          weights_gb: 14.2, role: base}
      - {id: allenai/OLMo-2-1124-7B-Instruct, weights_gb: 14.2, role: instruct}

# ---------------------------------------------------------------------------
# WITHDRAWN 2026-11-07 — the `dclm:` family was added (D059), its rationale was
# withdrawn (D065), and the family itself is now withdrawn (D070). It is kept
# here as a commented block, not deleted, because reinstating it is a plausible
# post-submission robustness check and the licence note must not be lost.
#
# Why it is not scored:
#   1. It is NOT an independent third corpus. olmo-mix-1124 is ~95%
#      DCLM-baseline by tokens (3.70T of 3.90T on the dataset card, "with no
#      additional filtering"); exact counts confirm it -- "she has" returns
#      94,109,792 in olmo-mix against 93,884,699 in DCLM, ratio 1.0024 (D065).
#   2. The fallback rationale -- that DCLM-7B vs OLMo-2-7B is a near-controlled
#      comparison of TRAINING RECIPE with data held almost constant, and that
#      the ~5% difference (pes2o, arXiv) would diverge on biomedical concepts --
#      DID NOT SURVIVE MEASUREMENT. Median co-occurrence count ratio
#      olmo / DCLM = 1.0071; median |delta skew_log2| = 0.0028. See
#      docs/model_selection.md section 6. The claimed divergence was not there.
#   3. Licence UNRESOLVED: tag `apple-ascl`, card body "Apple Sample Code
#      License", no LICENSE file in either repository (404), and the family is
#      not uniformly licensed (TRI-ML/DCLM-1B-IT is Apache-2.0). Do NOT
#      redistribute weights or publish a derived model without resolving this.
#
# If time allows after the primary results, reinstate `dclm-7b-it` ALONE as a
# one-model robustness check against OLMo-2-7B-Instruct. Adding the base model
# too doubles the cost for a comparison the instruct pair already makes.
#
# The CORPUS sweep stays live: `v4_dclm-baseline_llama` remains in
# configs/terms.yaml and its cached counts are the evidence for D069 and for the
# sharpened D054. Removing the model arms does not remove the corpus result.
#
#  dclm:
#    corpus_index: v4_dclm-baseline_llama
#    corpus_nested_in: v4_olmo-mix-1124_llama
#    models:
#      - {id: apple/DCLM-7B,            weights_gb: 13.8, role: base}
#      - {id: mlfoundations/dclm-7b-it, weights_gb: 13.8, role: instruct}

# ---------------------------------------------------------------------------
# CONTRAST — closed training data. RQ5 only. Full precision: a quantized
# audited model would confound precision with the open-vs-closed contrast.
# ---------------------------------------------------------------------------
contrast:
  - id: Qwen/Qwen3-8B
    weights_gb: 16.4
    dtype: float32
    corpus_index: null        # the point of RQ5: nothing to query
    generation:
      thinking: false         # pinned off; variable-length reasoning destroys
                              # run-to-run determinism

# ---------------------------------------------------------------------------
# JUDGE — never audited, never scored. Disjoint from the sets above (D006).
# ---------------------------------------------------------------------------
judge:
  # Production: 8-bit (D010). The 4-bit build below is kept for smoke tests, and
  # kappa is reported at BOTH precisions on the same validation subsample.
  id: mlx-community/Mistral-Small-24B-Instruct-2501-8bit
  runtime: mlx
  quantization: {bits: 8}
  weights_gb: 25.05
  smoke_variant:
    id: mlx-community/Mistral-Small-24B-Instruct-2501-4bit
    revision: 51ed0c6d2f98a25d8a60f19994f0e86c944995e0
    quantization: {bits: 4, group_size: 64}
    weights_gb: 13.26
  # Codes are admissible only if agreement with hand-coding clears this.
  validation:
    subsample_n: 100
    coders: [evans, aymen]
    min_kappa: 0.70
    report_kappa_at: [4bit, 8bit]

# ---------------------------------------------------------------------------
# Smoke configuration: full pipeline, minimal cost. Differs from production by
# one flag so the two cannot drift apart.
# ---------------------------------------------------------------------------
smoke:
  audit_models: [EleutherAI/pythia-70m]
  n_vignettes: 10
  judge: true
