# Term lists for RQ1 corpus counts.
#
# Gender terms are grouped so that each group's co-occurrence rate can be
# normalised by that group's own base frequency. Raw co-occurrence counts are
# meaningless without this: in the Pile, "he" occurs 2.42x as often as "she",
# and the two probes we ran had raw male/female co-occurrence ratios of 2.422
# and 2.416 — i.e. entirely accounted for by the pronoun base rate, with
# normalised skew of -0.0004 and +0.0030. See D022.

index_targets:
  - v4_piletrain_llama        # Pythia's training corpus
  - v4_olmo-mix-1124_llama    # OLMo 2 stage-1 mix (stage 2 is not indexed; D008)

# find_cnf co-occurrence window, in tokens. MUST be set explicitly: the API
# returns cnt=0 when max_diff_tokens is omitted, silently (D022).
window_tokens: 20
max_clause_freq: 500000

# PRIMARY measurement method (D023): exact n-gram counts of templated phrases.
# find_cnf windowed co-occurrence was abandoned -- it returns approx=True on every
# call and, with clauses far above max_clause_freq ("he" has 506M occurrences
# against a 500k cap), its estimates are not comparable. It disagreed with exact
# counts in SIGN: pneumonia -7.07 vs +2.01, ADHD +2.81 vs -0.09.
#
# Each template's denominator is its own prefix count, so the measure is
#   P(concept | "<pronoun> <predicate>")
# which normalises out both pronoun frequency and construction frequency.
phrase_templates:
  - "{pron} has"
  - "{pron} had"
  - "{pron} was diagnosed with"
  - "{pron} suffers from"
  - "{pron} developed"
  - "{pron} complained of"
  - "{pron} presented with"
  - "{pron} reported"

phrase_pronouns:
  female: [she]
  male:   [he]
  # "they" is overwhelmingly plural in corpus text, so this arm does not isolate
  # non-binary reference. Reported as a measurement limitation only.
  # NOT measured in the current sweep. "they has" is ungrammatical, so this arm
  # needs its own template set ("they have", "they were diagnosed with"), and
  # "they" is overwhelmingly plural in corpus text so it would not isolate
  # non-binary reference anyway. Omitted deliberately and reported as a gap, not
  # silently skipped. See D023.
  nonbinary: [they]

gender_terms:
  female: [she, her, woman, women, girl, girls, mother, female, lady]
  male:   [he, him, man, men, boy, boys, father, male, gentleman]
  nonbinary:
    # Treated separately and reported with heavy caveats. "they/them" is
    # overwhelmingly plural in corpus text, so these counts do NOT isolate
    # non-binary reference; the explicit terms are sparse. Reported as a
    # measurement limitation, never as a clean third comparison (D022).
    [non-binary, nonbinary, enby, genderqueer, transgender]

# Health concepts drawn from the 15 vignettes, so RQ1 and RQ2 speak about the
# same things and RQ4 can link them per concept.
health_concepts:
  G1-01: [pneumonia, community-acquired pneumonia, antibiotic]
  G1-02: [malaria, artemisinin]
  G1-03: [asthma, asthma attack, inhaler]
  G1-04: [cellulitis, skin infection]
  G1-05: [type 2 diabetes, metformin]
  G2-01: [pregnancy test, ectopic pregnancy]
  G2-02: [prostate, urinary symptoms]
  G2-03: [cervical screening, cervical cancer]
  G3-01: [pain, severe pain, analgesia, morphine, opioid]
  G3-02: [chest pain, heart attack, angina]
  G3-04: [ADHD, attention deficit]
  G3-05: [autism, autistic]
  G4-01: [ankle sprain, sprained ankle]
  G4-02: [conjunctivitis, pink eye]
  G4-03: [sore throat, strep throat]

# The dropped G3-03 construct survives as a concept here even though it has no
# vignette (D020). These terms come from the psychologizing literature; see
# docs/g303_psychologizing_theme.md.
# Curated for the "X has/had/was diagnosed with ..." frame: noun phrases only,
# and nothing polysemous. See polysemy_excluded below.
psychologizing_concepts:
  attribution: [anxiety, depression, a panic attack, panic attacks, an anxiety disorder]
  dismissal:   [psychosomatic symptoms, somatization disorder, a conversion disorder,
                medically unexplained symptoms]
  affect:      [hysteria, emotional distress]

# Removed after the feasibility probe, with reasons. Worth reporting: term
# selection is a methodological choice that changes results, not a detail.
polysemy_excluded:
  stressed:     "speech verb -- 'he stressed that ...' dominates. Probe gave -0.858, contaminated."
  stress:       "verb/noun ambiguity in the same frame."
  anxious:      "adjective; does not fit 'has X'. Probe counts were 6/9 -- unusable."
  imagining:    "verb."
  exaggerating: "verb."
  dramatic:     "adjective, and highly polysemous."
  hysterical:   "adjective; does not fit 'has X'. Noun form 'hysteria' retained."
  emotional:    "adjective; replaced by the noun phrase 'emotional distress'."

# Triage and treatment language, for concept-level links to RQ2 outcomes.
# Decision language does not fit the "has/was diagnosed with" frame (nobody
# "has an x-ray" in the diagnostic sense), so these are excluded from the exact
# phrase sweep. Measuring them would need a separate template set
# ("{pron} was referred for", "{pron} underwent"). Deferred, not dropped.
decision_concepts_deferred:
  investigation: [x-ray, radiograph, blood test, ECG, referral]
  urgency:       [urgent, emergency, immediately, routine]
