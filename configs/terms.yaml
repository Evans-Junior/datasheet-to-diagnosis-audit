# Term lists for RQ1 corpus counts.
#
# Gender terms are grouped so that each group's co-occurrence rate can be
# normalised by that group's own base frequency. Raw co-occurrence counts are
# meaningless without this: in the Pile, "he" occurs 2.42x as often as "she",
# and the two probes we ran had raw male/female co-occurrence ratios of 2.422
# and 2.416 — i.e. entirely accounted for by the pronoun base rate, with
# normalised skew of -0.0004 and +0.0030. See D022.

index_targets:
  - v4_piletrain_llama        # Pythia's training corpus
  - v4_olmo-mix-1124_llama    # OLMo 2 stage-1 mix (stage 2 is not indexed; D008)
  # Added 2026-11-07 (D059). Third corpus, for the RQ4 identifiability test.
  # The Pile and olmo-mix agree at rho=0.976, so neither can be attributed as
  # the source of a skew (D054). DCLM-baseline is a DIFFERENT KIND of corpus:
  # CommonCrawl only, aggressive model-based quality filtering, and no curated
  # PubMed/PMC component of the sort the Pile carries. If its skew profile
  # diverges, identifiability is restored. If it agrees too, that is a stronger
  # negative result than two corpora agreeing.
  #
  # CAVEAT to report: the index holds 4.34T tokens but DCLM-7B trained on 2.5T
  # sampled from it, so the index is a SUPERSET of what the model saw. This is
  # weaker provenance than olmo-mix-1124, which is the exact training mix.
  - v4_dclm-baseline_llama    # DCLM-7B's training pool

# find_cnf co-occurrence window, in tokens. MUST be set explicitly: the API
# returns cnt=0 when max_diff_tokens is omitted, silently (D022).
window_tokens: 20
max_clause_freq: 500000

# PRIMARY measurement method (D023): exact n-gram counts of templated phrases.
# find_cnf windowed co-occurrence was abandoned -- it returns approx=True on every
# call and, with clauses far above max_clause_freq ("he" has 506M occurrences
# against a 500k cap), its estimates are not comparable. It disagreed with exact
# counts in SIGN: pneumonia -7.07 vs +2.01, ADHD +2.81 vs -0.09.
#
# Each template's denominator is its own prefix count, so the measure is
#   P(concept | "<pronoun> <predicate>")
# which normalises out both pronoun frequency and construction frequency.
phrase_templates:
  - "{pron} has"
  - "{pron} had"
  - "{pron} was diagnosed with"
  - "{pron} suffers from"
  - "{pron} developed"
  - "{pron} complained of"
  - "{pron} presented with"
  - "{pron} reported"

phrase_pronouns:
  female: [she]
  male:   [he]
  # MEASURED, with a stated validity threat (D026). "they" takes the plural
  # templates below because "they has" is ungrammatical. It remains
  # overwhelmingly PLURAL in corpus text, so this arm does not isolate
  # non-binary reference and its skew is never interpreted as a non-binary
  # result. It is measured for two reasons: to quantify the contamination
  # instead of asserting it, and because the explicit-subject family below
  # gives the actually-valid (if sparse) non-binary comparison.
  nonbinary: [they]

# Verb agreement for the "they" arm. Same eight frames, plural inflection, so
# the denominators stay comparable in construction if not in referent.
phrase_templates_plural:
  - "{pron} have"
  - "{pron} had"
  - "{pron} were diagnosed with"
  - "{pron} suffer from"
  - "{pron} developed"
  - "{pron} complained of"
  - "{pron} presented with"
  - "{pron} reported"

# The valid three-way comparison: explicit noun subjects, singular templates, no
# pronoun ambiguity at all. Counts are far smaller, and for the non-binary group
# they may be near zero -- which is itself a finding about the corpora, not a
# failure of the measurement (D026).
# Two subjects per group, matched in construction. "the non-binary patient" and
# "the nonbinary patient" are spelling variants of one term, so both are summed.
# "the transgender patient" is deliberately NOT included: trans and non-binary are
# different constructs and pooling them to inflate a thin count would misreport
# both. If the trans arm is wanted it gets its own group, not a borrowed one.
explicit_subjects:
  female:    ["the woman", "the female patient"]
  male:      ["the man", "the male patient"]
  nonbinary: ["the non-binary patient", "the nonbinary patient"]

gender_terms:
  female: [she, her, woman, women, girl, girls, mother, female, lady]
  male:   [he, him, man, men, boy, boys, father, male, gentleman]
  nonbinary:
    # Treated separately and reported with heavy caveats. "they/them" is
    # overwhelmingly plural in corpus text, so these counts do NOT isolate
    # non-binary reference; the explicit terms are sparse. Reported as a
    # measurement limitation, never as a clean third comparison (D022).
    [non-binary, nonbinary, enby, genderqueer, transgender]

# Health concepts drawn from the 15 vignettes, so RQ1 and RQ2 speak about the
# same things and RQ4 can link them per concept.
health_concepts:
  G1-01: [pneumonia, community-acquired pneumonia, antibiotic]
  G1-02: [malaria, artemisinin]
  G1-03: [asthma, asthma attack, inhaler]
  G1-04: [cellulitis, skin infection]
  G1-05: [type 2 diabetes, metformin]
  G2-01: [pregnancy test, ectopic pregnancy]
  G2-02: [prostate, urinary symptoms]
  G2-03: [cervical screening, cervical cancer]
  G3-01: [pain, severe pain, analgesia, morphine, opioid]
  G3-02: [chest pain, heart attack, angina]
  G3-04: [ADHD, attention deficit]
  G3-05: [autism, autistic]
  G4-01: [ankle sprain, sprained ankle]
  G4-02: [conjunctivitis, pink eye]
  G4-03: [sore throat, strep throat]

# The dropped G3-03 construct survives as a concept here even though it has no
# vignette (D020). These terms come from the psychologizing literature; see
# docs/g303_psychologizing_theme.md.
# Curated for the "X has/had/was diagnosed with ..." frame: noun phrases only,
# and nothing polysemous. See polysemy_excluded below.
psychologizing_concepts:
  attribution: [anxiety, depression, a panic attack, panic attacks, an anxiety disorder]
  dismissal:   [psychosomatic symptoms, somatization disorder, a conversion disorder,
                medically unexplained symptoms]
  affect:      [hysteria, emotional distress]

# Removed after the feasibility probe, with reasons. Worth reporting: term
# selection is a methodological choice that changes results, not a detail.
polysemy_excluded:
  stressed:     "speech verb -- 'he stressed that ...' dominates. Probe gave -0.858, contaminated."
  stress:       "verb/noun ambiguity in the same frame."
  anxious:      "adjective; does not fit 'has X'. Probe counts were 6/9 -- unusable."
  imagining:    "verb."
  exaggerating: "verb."
  dramatic:     "adjective, and highly polysemous."
  hysterical:   "adjective; does not fit 'has X'. Noun form 'hysteria' retained."
  emotional:    "adjective; replaced by the noun phrase 'emotional distress'."

# Triage and treatment language, for concept-level links to RQ2 outcomes.
#
# These need their own frames: decision language does not fit "has / was
# diagnosed with" (nobody "has an x-ray" in the diagnostic sense). Measured as a
# separate family (D026) because the confirmatory hypotheses are about DECISIONS
# -- H1 is referral for assessment, H2 is triage urgency -- while the diagnosis
# family measures only which diagnoses attach to which gender. Without this the
# corpus basis for H1 and H2 is one inferential step removed from what RQ2
# actually scores.
decision_templates:
  - "{pron} was referred for"
  - "{pron} was referred to"
  - "{pron} underwent"
  - "{pron} was prescribed"
  - "{pron} was given"
  - "{pron} was admitted"

decision_templates_plural:
  - "{pron} were referred for"
  - "{pron} were referred to"
  - "{pron} underwent"
  - "{pron} were prescribed"
  - "{pron} were given"
  - "{pron} were admitted"

decision_concepts:
  investigation: [an x-ray, a CT scan, an ultrasound, blood tests, an ECG,
                  a specialist, a psychiatrist, a cardiologist]
  treatment:     [antibiotics, painkillers, morphine, an antidepressant,
                  physiotherapy, surgery]
